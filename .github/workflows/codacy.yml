name: Codacy Coverage Reporter

on:
  workflow_run:
    workflows:
      - Integration tests
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-coverage-linux:
    if: github.repository == 'libmonero/monero-c' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # the commit that Coverage tested, which is the head of the pull request
      COMMIT_UUID: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download coverage report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: coverage-reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # The reporter is the version that is named here, and it is checked against the SHA-512 that is written here, which is the one that Codacy
      # publishes on GitHub (codacy/codacy-coverage-reporter, release 14.1.3, file codacy-coverage-reporter-linux.SHA512SUM). The script get.sh of
      # Codacy, which this step ran before, is not fetched any more: it changes with no commit here, and it ran with the token of the project.
      # To update, set the version, download the binary and the .SHA512SUM of the release, check one against the other and write the hash
      - name: Download the Codacy reporter
        if: steps.download.outcome == 'success'
        env:
          REPORTER_VERSION: 14.1.3
          REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
        run: |
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSLo codacy-coverage-reporter "https://artifacts.codacy.com/bin/codacy-coverage-reporter/$REPORTER_VERSION/codacy-coverage-reporter-linux"
          echo "$REPORTER_SHA512  codacy-coverage-reporter" | sha512sum -c -
          chmod +x codacy-coverage-reporter

      # only this step has the token
      - name: Report c++ and c coverage
        if: steps.download.outcome == 'success'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          ./codacy-coverage-reporter report --language cpp --coverage-reports coverage-reports/coverage.info --partial --commit-uuid "$COMMIT_UUID"
          ./codacy-coverage-reporter report --language c --coverage-reports coverage-reports/coverage.info --partial --commit-uuid "$COMMIT_UUID"
          ./codacy-coverage-reporter final --commit-uuid "$COMMIT_UUID"
